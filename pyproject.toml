# pip and uv install this file. The Pixi workspace and package are pixi.toml.

[build-system]
requires = ["setuptools>=61,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsifier"
version = "0.1.0"
description = "Sparsity-based pruning of LLMs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "nlaanait" }]
dependencies = ["click>=8.1"]

[project.scripts]
sparsifier = "sparsifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
