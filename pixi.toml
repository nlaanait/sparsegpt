[workspace]
name = "sparsifier"
version = "0.1.0"
description = "Sparsity-based pruning of LLMs."
authors = ["nlaanait"]
channels = ["conda-forge"]
platforms = [
  { platform = "linux-aarch64", cuda = "13.0" },
  # This GH200 480GB: driver 570.148.08, CUDA 12.8, SM 9.0, Grace (neoverse_v2).
  { name = "gh200", platform = "linux-aarch64", cuda = { driver = "12.8", arch = "9.0" }, archspec = "neoverse_v2", glibc = "2.35", linux = "6.8.0" },
]
preview = ["pixi-build"]

[dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<82"
ninja = "*"
packaging = "*"
sparsifier = { path = "." }

[package]
name = { workspace = true }
version = { workspace = true }
description = { workspace = true }
authors = { workspace = true }

[package.build]
backend = { name = "pixi-build-python", version = "0.*" }

[package.host-dependencies]
python = "3.12.*"
setuptools = "<82"

[package.run-dependencies]
click = ">=8.1"

[pypi-dependencies]
torch = { version = "==2.12.0+cu130", index = "https://download.pytorch.org/whl/cu130" }
transformers = ">=4.56"
datasets = ">=3.6"
accelerate = ">=1.8"
safetensors = ">=0.5"
numpy = ">=2"
scipy = ">=1.14"
tqdm = ">=4.67"
pytest = ">=8.3"
plotly = ">=6"
ipykernel = ">=6.29"
jupyter = ">=1.1"
# Qwen3.5 linear-attention kernels (avoids slow PyTorch fallbacks).
# Default/cu130 hosts: stage a local wheel under ~/.pixi/wheels/cu130 and pin it
# here when present. GH200 driver 12.8 uses [environments.gh200] instead, which
# pulls the Dao-AILab cu12/torch2.10 aarch64 wheel by URL (no local path).
# causal-conv1d = { path = "/home/nlaanait/.pixi/wheels/cu130/causal_conv1d-1.7.0-cp312-cp312-linux_aarch64.whl" }
flash-linear-attention = { version = ">=0.5.0", extras = ["cuda"] }
# SM121 Gated DeltaNet (Atlas-Inference/gdn) via transformers use_kernels.
# transformers 5.20 accepts 0.17.2 <= kernels < 0.18.
kernels = ">=0.17.2,<0.18"

[activation.env]
PYTHONPATH = "src:."

[tasks.cuda-check]
description = "Print the torch build and the visible GPU"
cmd = """python -c "import torch; print(torch.__version__); print(torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no-cuda')" """

[tasks.test]
description = "Run the test suite"
cmd = "python -m pytest -v"

[tasks.test-sparsegpt]
description = "Run the SparseGPT solver tests"
cmd = "python -m pytest -v tests/test_sparsegpt.py"

[tasks.geometry-demo]
description = "Synthetic layer demo: activation-only versus geometry-aware SparseGPT. Pass cpu or cuda, then sparsity targets."
cmd = """python -m examples.geometry_demo --device {{ device }} --output {{ "geometry_results_cuda" if device == "cuda" else "geometry_results" }} --requested-sparsity {{ sparsity }}"""
args = [
  { arg = "device", default = "cpu" },
  { arg = "sparsity", default = "0.5 0.75 0.9 0.95" },
]

[tasks.tangent-reference]
description = "Run the multi-seed CPU reference study for tangent-aware pruning"
cmd = "python examples/tangent_pruning_experiment.py --output /tmp/tangent-pruning-reference.json"

# Qwen runs through the Click command. N:M flags are --zeros-per-group and --group-size.
[tasks.demo-qwen]
description = "SparseGPT on Qwen3.5-2B"
cmd = "python -m sparsifier Qwen/Qwen3.5-2B c4 --sparsity {{ sparsity }} --save sparse_opt/qwen3.5-2b"
args = [{ arg = "sparsity", default = "0.5" }]

[tasks.demo-qwen-nm]
description = "2:4 SparseGPT on Qwen3.5-2B"
cmd = "python -m sparsifier Qwen/Qwen3.5-2B c4 --zeros-per-group 2 --group-size 4 --save sparse_opt/qwen3.5-2b-2-4"

[tasks.demo-qwen-smoke]
description = "Qwen3.5-2B prune of one layer, four C4 samples, no eval"
cmd = "python -m sparsifier Qwen/Qwen3.5-2B c4 --sparsity {{ sparsity }} --nsamples 4 --maxlayer 1 --skip-eval --save sparse_opt/qwen3.5-2b-smoke"
args = [{ arg = "sparsity", default = "0.5" }]

[tasks._qwen-figure1]
cmd = "python -m drivers.qwen_figure1 {{ extra }}"
args = [{ arg = "extra", default = "" }]

[tasks.qwen-figure1]
description = "WikiText2 perplexity versus sparsity for Qwen3.5-2B. Resumes from results/qwen3.5/qwen3.5-2b_wikitext2.json."
depends-on = ["_qwen-figure1"]

[tasks.qwen-figure1-plot]
description = "Redraw the Qwen3.5-2B sparsity page from saved JSON"
depends-on = [{ task = "_qwen-figure1", args = ["--plot-only"] }]

[tasks._qwen-figure1-family]
cmd = "python -m drivers.qwen_figure1_family {{ extra }}"
args = [{ arg = "extra", default = "" }]

[tasks.qwen-figure1-family]
description = "WikiText2 perplexity versus sparsity for each Qwen3.5 model. Resumes from results/qwen3.5/qwen3.5_family_sparsity_wikitext2.json."
depends-on = ["_qwen-figure1-family"]

[tasks.qwen-figure1-family-plot]
description = "Redraw the Qwen3.5 family sparsity page from saved JSON"
depends-on = [{ task = "_qwen-figure1-family", args = ["--plot-only"] }]

[tasks._qwen-ptb]
cmd = "python -u -m drivers.qwen_ptb {{ extra }}"
args = [{ arg = "extra", default = "" }]

[tasks.qwen-ptb]
description = "PTB perplexity versus sparsity, reusing C4 checkpoints in sparse_opt. Resumes from results/qwen3.5/qwen3.5_family_sparsity_ptb.json."
depends-on = ["_qwen-ptb"]

[tasks.qwen-ptb-plot]
description = "Redraw the PTB sparsity page from saved JSON"
depends-on = [{ task = "_qwen-ptb", args = ["--plot-only"] }]

[tasks._qwen-figure2]
cmd = "python -m drivers.qwen_figure2 {{ extra }}"
args = [{ arg = "extra", default = "" }]

[tasks.qwen-figure2]
description = "WikiText2 perplexity versus Qwen3.5 model size. Resumes from results/qwen3.5/qwen3.5_family_wikitext2.json."
depends-on = ["_qwen-figure2"]

[tasks.qwen-figure2-plot]
description = "Redraw the Qwen3.5 size page from saved JSON"
depends-on = [{ task = "_qwen-figure2", args = ["--plot-only"] }]

# The default environment stays on the CUDA 13.0 platform it was locked with.
# A GH200 host with a CUDA 12.8 driver needs the separate gh200 environment.
[environments.default]
platforms = ["linux-aarch64-cuda-13-0"]

# GB10 / CUDA 13: keep the local extension separate from the default env.
# Build or stage this wheel with scripts/build_causal_conv1d_wheel.sh.
[feature.gb10.pypi-dependencies]
causal-conv1d = { path = "/home/nlaanait/.pixi/wheels/cu130/causal_conv1d-1.7.0-cp312-cp312-linux_aarch64.whl" }

[environments.gb10]
features = ["gb10"]
platforms = ["linux-aarch64-cuda-13-0"]

# Newest pair this driver can load that has an aarch64 causal-conv1d wheel:
# Python 3.12 and torch 2.10.0+cu128. PyTorch 2.11+ has no matching
# causal-conv1d build, and CUDA 13 wheels need a newer driver than 570.148.08.
# Pixi refreshes every environment before a run. Without the CUDA 13
# causal-conv1d wheel, use: pixi run --frozen -e gh200 <task>
[environments.gh200]
features = []
no-default-feature = true
platforms = ["gh200"]

[environments.gh200.dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<82"
ninja = "*"
packaging = "*"
sparsifier = { path = "." }

[environments.gh200.pypi-dependencies]
torch = { version = "==2.10.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0%2Bcu12torch2.10cxx11abiTRUE-cp312-cp312-linux_aarch64.whl" }
transformers = ">=4.56"
datasets = ">=3.6"
accelerate = ">=1.8"
safetensors = ">=0.5"
numpy = ">=2"
scipy = ">=1.14"
tqdm = ">=4.67"
pytest = ">=8.3"
plotly = ">=6"
ipykernel = ">=6.29"
jupyter = ">=1.1"
flash-linear-attention = { version = ">=0.5.0", extras = ["cuda", "conv1d"] }
kernels = ">=0.17.2,<0.18"

[environments.gh200.activation.env]
PYTHONPATH = "src:."

[environments.gh200.tasks]
cuda-check = "python -c \"import torch; print(torch.__version__); print(torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no-cuda')\""
test = "python -m pytest -v tests/"
test-sparsegpt = "python -m pytest -v tests/test_sparsegpt.py"
tangent-reference = "python examples/tangent_pruning_experiment.py --output /tmp/tangent-pruning-reference.json"
demo-qwen = { cmd = "python -m sparsifier Qwen/Qwen3.5-2B c4 --sparsity {{ sparsity }} --save sparse_opt/qwen3.5-2b", args = [{ arg = "sparsity", default = "0.5" }] }
demo-qwen-nm = "python -m sparsifier Qwen/Qwen3.5-2B c4 --zeros-per-group 2 --group-size 4 --save sparse_opt/qwen3.5-2b-2-4"
demo-qwen-smoke = { cmd = "python -m sparsifier Qwen/Qwen3.5-2B c4 --sparsity {{ sparsity }} --nsamples 4 --maxlayer 1 --skip-eval --save sparse_opt/qwen3.5-2b-smoke", args = [{ arg = "sparsity", default = "0.5" }] }
